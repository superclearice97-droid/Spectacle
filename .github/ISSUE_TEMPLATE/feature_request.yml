name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Spectacle to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: If this feature would send data off the home server, I understand it must be optional and off by default.
