name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Syntax check
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done
      - name: End-to-end smoke test
        run: npm test

  smart-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        size: [s, l]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Logic tests (no model)
        run: node test/smart-unit.js
      - name: Install the smart detection add-on exactly as users do
        run: npm run smart-detection -- --size ${{ matrix.size }}
      - name: Person walks into a zone → one alert
        run: node test/smart-e2e.js

  two-way-talk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ffmpeg and a test browser
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --quiet playwright==1.55.0 && python -m playwright install --with-deps chromium
          # A virtual sound card, like a real phone or computer has (GitHub's machines have none).
          sudo apt-get install -y pulseaudio
          pulseaudio -D --exit-idle-time=-1 && pactl load-module module-null-sink sink_name=virtual && pactl set-default-sink virtual
      - name: Doorbell + two-way talk in real Chromium (simulated mic and camera)
        run: python test/talk_e2e.py
