name: Android app

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml', 'package.json']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach Spectacle.apk to a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.ver.outputs.release }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # A release is published when package.json's version is new on main (or a v* tag is pushed).
      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          REL=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; REL=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then REL=true
          fi
          if [ "$REL" = true ]; then echo "VERSION_NAME=$V" >> "$GITHUB_ENV"; else echo "VERSION_NAME=$V-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "release=$REL" >> "$GITHUB_OUTPUT"; echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version $V, publish release: $REL"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KS: ${{ secrets.SPECTACLE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SPECTACLE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            # Tolerate spaces/newlines from copy-paste; report problems without ever printing the secrets.
            printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/spectacle.jks" 2>/dev/null || { echo "::error::SPECTACLE_KEYSTORE_B64 isn't valid base64. Paste the long line from the secrets file again, with nothing else."; exit 1; }
            KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '\r\n')
            if ! keytool -list -keystore "$RUNNER_TEMP/spectacle.jks" -storepass "$KS_PASS" >/dev/null 2>&1; then
              echo "::error::The signing key couldn't be opened (size $(wc -c < "$RUNNER_TEMP/spectacle.jks") bytes, expected about 1018). Either SPECTACLE_KEYSTORE_PASSWORD is wrong ($(printf '%s' "$KS_PASS" | wc -c) characters, expected 32) or SPECTACLE_KEYSTORE_B64 is incomplete ($(printf '%s' "$KS" | tr -d ' \r\n\t' | wc -c) characters, expected 1360)."
              exit 1
            fi
            keytool -list -keystore "$RUNNER_TEMP/spectacle.jks" -storepass "$KS_PASS" -alias spectacle >/dev/null 2>&1 || { echo "::error::The key inside the keystore isn't named 'spectacle'."; exit 1; }
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/spectacle.jks" >> "$GITHUB_ENV"
            echo "Signing with the Spectacle release key."
          elif [ "${{ steps.ver.outputs.release }}" = true ]; then
            echo "::error::Release builds need the SPECTACLE_KEYSTORE_B64 and SPECTACLE_KEYSTORE_PASSWORD secrets (see docs/android-signing.md)."
            exit 1
          else
            echo "::warning::No signing key secret yet; building a test APK with a throwaway key."
          fi

      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            msg=$(grep -A12 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -14 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::Gradle build failed%0A$msg"; exit 1; }

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Spectacle.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs Spectacle.apk | head -5 || true
          sha256sum Spectacle.apk | tee Spectacle.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Spectacle-apk
          path: |
            Spectacle.apk
            Spectacle.apk.sha256

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: Spectacle-apk
      - name: Start a test Spectacle server
        run: bash android/ci/start-server.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 android/ci/emulator_test.py

  release:
    if: needs.build.outputs.release == 'true'
    needs: [build, emulator-test]   # only publish an APK that passed the emulator test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Spectacle-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install on Android
          1. On your phone, tap **Spectacle.apk** below to download it.
          2. Open the download. If asked, allow your browser to install apps, then tap **Install**.
          3. Open Spectacle and tap **Paste my invite** (copy the invite message you were sent first).

          Already have Spectacle? Installing this version updates it and keeps you signed in.
          EOF
          V="${{ needs.build.outputs.version }}"
          gh release create "v$V" Spectacle.apk Spectacle.apk.sha256 -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Spectacle $V" --notes-file notes.md

