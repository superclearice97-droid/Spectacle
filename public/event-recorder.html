<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectacle Event Recorder</title>
<style>body{font:16px system-ui;background:#101820;color:#f4f7fa;max-width:720px;margin:24px auto;padding:16px}button,select,input{font:inherit;padding:12px;border-radius:9px}button{cursor:pointer;background:#4ec9aa;border:0;margin:5px}button:disabled{opacity:.45}video{width:100%;max-height:380px;background:#000;border-radius:12px}section{padding:14px;background:#1d2935;border-radius:12px;margin:14px 0}label{display:block;margin:12px 0}a{color:#78ddff}.small{color:#b5c6d1;font-size:14px}li{margin:12px 0;overflow-wrap:anywhere}</style></head>
<body><h1>Event Recorder</h1><p>Local, on-demand camera or screen recording. Nothing is uploaded.</p>
<section><label>Source <select id="source"><option value="camera">Camera</option><option value="screen">Screen</option></select></label>
<label>Quality <select id="quality"><option value="480">480p · balanced storage</option><option value="360">360p · maximum storage</option><option value="720">720p · clearer</option></select></label>
<label><input type="checkbox" id="audio"> Include audio (requires permission)</label>
<button id="start">Start recording</button><button id="stop" disabled>Stop & save</button>
<p id="status" role="status" aria-live="polite">Ready</p><video id="preview" autoplay muted playsinline></video></section>
<section><h2>Saved events</h2><p class="small">Recordings are saved to this browser's local storage (IndexedDB). Export important clips; clearing browser data may erase them. Browser support for screen capture varies, especially on Android.</p><ul id="clips"></ul><button id="refresh">Refresh library</button></section>
<script>
'use strict';
const $=id=>document.getElementById(id);
let recorder=null,stream=null,chunks=[],started=0,stopping=false;
const DB='spectacle-event-recordings';
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function tx(mode,work){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction('clips',mode),store=t.objectStore('clips');let req;try{req=work(store)}catch(e){db.close();reject(e);return}t.oncomplete=()=>{resolve(req?.result);db.close()};t.onerror=()=>{reject(t.error);db.close()}})}
function format(bytes){return (bytes/1048576).toFixed(1)+' MB'}
function mime(){return ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||''}
function stopTracks(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null}
function ui(active){$('start').disabled=active;$('stop').disabled=!active;$('source').disabled=active;$('quality').disabled=active;$('audio').disabled=active}
async function start(){try{if(!window.MediaRecorder||!navigator.mediaDevices)throw Error('Recording is unsupported in this browser.');const height=Number($('quality').value),audio=$('audio').checked;
const constraints={video:{width:{ideal:Math.round(height*16/9)},height:{ideal:height},frameRate:{ideal:15,max:15}},audio};
stream=$('source').value==='camera'?await navigator.mediaDevices.getUserMedia(constraints):await navigator.mediaDevices.getDisplayMedia(constraints);
const track=stream.getVideoTracks()[0];if(!track)throw Error('No video track available.');
track.addEventListener('ended',()=>{if(recorder?.state==='recording')stop()});
$('preview').srcObject=stream;chunks=[];stopping=false;
const type=mime(),opts={videoBitsPerSecond:height===360?260000:height===480?480000:900000,audioBitsPerSecond:48000};if(type)opts.mimeType=type;
recorder=new MediaRecorder(stream,opts);
recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
recorder.onerror=e=>{$('status').textContent='Recorder error: '+(e.error?.message||'unknown')};
recorder.onstop=async()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});stopTracks();ui(false);try{if(!blob.size)throw Error('Recording is empty');const id=Date.now()+'-'+Math.random().toString(36).slice(2,8);await tx('readwrite',s=>s.put({id,created:Date.now(),duration:Math.round((Date.now()-started)/1000),source:$('source').value,blob}));$('status').textContent='Saved event · '+format(blob.size);await refresh()}catch(e){$('status').textContent='Could not save: '+e.message+' (storage may be full)';const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='spectacle-recovery-'+Date.now()+'.webm';a.textContent='Download unsaved recording';$('status').append(' ',a)}chunks=[]};
recorder.start(1000);started=Date.now();ui(true);$('status').textContent='Recording · '+$('source').value;
}catch(e){stopTracks();ui(false);$('status').textContent='Could not start: '+e.message}}
function stop(){if(!recorder||recorder.state==='inactive'||stopping)return;stopping=true;$('stop').disabled=true;$('status').textContent='Saving recording…';recorder.stop()}
async function refresh(){const records=await tx('readonly',s=>s.getAll());const ul=$('clips');ul.replaceChildren();records.sort((a,b)=>b.created-a.created);for(const c of records){const li=document.createElement('li');const name=document.createElement('span');name.textContent=new Date(c.created).toLocaleString()+' · '+c.source+' · '+c.duration+'s · '+format(c.blob.size)+' ';li.append(name);const download=document.createElement('button');download.textContent='Download';download.onclick=()=>{const url=URL.createObjectURL(c.blob),a=document.createElement('a');a.href=url;a.download='spectacle-'+c.id+(c.blob.type.includes('mp4')?'.mp4':'.webm');a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};li.append(download);const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this recording permanently?'))return;await tx('readwrite',s=>s.delete(c.id));refresh()};li.append(del);ul.append(li)}if(!records.length){const li=document.createElement('li');li.textContent='No events recorded yet.';ul.append(li)}}
$('start').onclick=start;$('stop').onclick=stop;$('refresh').onclick=()=>refresh().catch(e=>$('status').textContent=e.message);
refresh().catch(e=>$('status').textContent='Storage unavailable: '+e.message);
</script></body></html>
